services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: manutencao_app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    networks:
      - manutencao_net
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: manutencao_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - manutencao_net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: manutencao_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: manutencao
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: secret
      MYSQL_USER: manutencao
    ports:
      - "3307:3306"
    volumes:
      - manutencao_db_data:/var/lib/mysql
    networks:
      - manutencao_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: manutencao_scheduler
    restart: unless-stopped
    working_dir: /var/www/backend
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./backend:/var/www/backend
    networks:
      - manutencao_net
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: manutencao_frontend
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - manutencao_net
    profiles:
      - dev

networks:
  manutencao_net:
    driver: bridge

volumes:
  manutencao_db_data:
